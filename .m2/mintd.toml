# cdk-mintd v0.18.3 config for SplitNut. The mint holds no seed or mnemonic:
# every blind signature and proof check goes to the remote signer.
#
# v0.18 stores config in the mint database. Load this file once with:
#   cdk-mintd --work-dir <dir> config init --new-mint --file config/mintd.toml
# then start with: cdk-mintd --work-dir <dir>
# (spike.sh substitutes /home/claude/splitnut/.m2/certs with the absolute certs directory.)

[info]
url = "http://127.0.0.1:8085/"
listen_host = "127.0.0.1"
listen_port = 8085

[signatory]
enabled = true
address = "127.0.0.1"
port = 15060
tls_dir = "/home/claude/splitnut/.m2/certs"

[database]
engine = "sqlite"

[payment_backend]
backend = "fakewallet"
unit = "sat"

[onchain]
onchain_backend = "none"

[fake_wallet]
fee_percent = 0.0
reserve_fee_min = 1
custom_payment_methods = []
min_delay_time = 1
max_delay_time = 2
