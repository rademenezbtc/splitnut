[workspace]
resolver = "2"
members = [
    "crates/splitnut-core",
    "crates/splitnut-proto",
    "crates/splitnut-dealer",
    "crates/splitnut-guardian",
    "crates/splitnut-coord",
    "crates/splitnut-marmot",
    "crates/splitnut-relay",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rademenezbtc/splitnut"
rust-version = "1.85"

[workspace.dependencies]
# CDK is pinned exactly: the signatory gRPC schema must match the cdk-mintd binary we run.
# The three crates are patched (bottom of this file) to CDK v0.18.3 plus operation context.
cashu = { version = "=0.18.3" }
cdk-common = { version = "=0.18.3", default-features = false, features = ["mint"] }
cdk-signatory = { version = "=0.18.3", default-features = false, features = ["grpc"] }

# Marmot: mdk-core 0.8 is MLS-only (events in, events out); nostr-sdk does the relay I/O.
mdk-core = { version = "=0.8.0" }
mdk-memory-storage = { version = "=0.8.0" }
mdk-sqlite-storage = { version = "=0.8.0" }
mdk-storage-traits = { version = "=0.8.0" }
nostr-sdk = { version = "=0.44.1", default-features = false, features = ["nip59"] }
nostr-relay-builder = { version = "=0.44.1" }

k256 = { version = "0.13", features = ["arithmetic", "serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = "0.37"
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

splitnut-core = { path = "crates/splitnut-core" }
splitnut-proto = { path = "crates/splitnut-proto" }
splitnut-marmot = { path = "crates/splitnut-marmot" }

# CDK v0.18.3 plus one commit: the mint passes operation context (a swap's inputs, a melt's
# quote and inputs, the quotes behind an issuance) to the signatory, so guardians can refuse
# unbacked outputs. Build cdk-mintd from the same commit (docs/RUNNING.md).
[patch.crates-io]
cashu = { git = "https://github.com/rademenezbtc/cdk", rev = "702e5bc76b0cfa88b6b3f4ecb5920bfbf7edd4ab" }
cdk-common = { git = "https://github.com/rademenezbtc/cdk", rev = "702e5bc76b0cfa88b6b3f4ecb5920bfbf7edd4ab" }
cdk-signatory = { git = "https://github.com/rademenezbtc/cdk", rev = "702e5bc76b0cfa88b6b3f4ecb5920bfbf7edd4ab" }
