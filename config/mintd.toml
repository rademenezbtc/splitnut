# cdk-mintd v0.18.3 config for SplitNut. The mint holds no seed or mnemonic:
# every blind signature and proof check goes to the remote signer.
#
# v0.18 stores config in the mint database. Load this file once with:
#   cdk-mintd --work-dir <dir> config init --new-mint --file config/mintd.toml
# then start with: cdk-mintd --work-dir <dir>
# (The scripts substitute @CERTS@, and @URL@ / @LISTEN@ when present.)

[info]
url = "@URL@"
listen_host = "@LISTEN@"
listen_port = 8085

[mint_info]
name = "SplitNut threshold mint (demo)"
description = "Test sats on a fake Lightning backend. Every signature needs 2 of 3 guardians; this server holds no keys."
description_long = "SplitNut splits each mint key across guardians who coordinate over Marmot (MLS over Nostr). Any t of n must cooperate to sign, so no single party holds the mint's keys. https://github.com/rademenezbtc/splitnut"
motd = "Demo mint: sats here are not real."

[signatory]
enabled = true
address = "127.0.0.1"
port = 15060
tls_dir = "@CERTS@"

[database]
engine = "sqlite"

[payment_backend]
backend = "fakewallet"
unit = "sat"

[onchain]
onchain_backend = "none"

[fake_wallet]
fee_percent = 0.0
reserve_fee_min = 1
custom_payment_methods = []
min_delay_time = 1
max_delay_time = 2
